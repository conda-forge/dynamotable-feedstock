{% set name = "dynamotable" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/alisterburt/dynamotable/archive/v{{ version }}.tar.gz
  sha256: f66ea0274deae25de8d29d5be1744515c025e1f5425e537e7deabe58e5657ca4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pandas
    - pip
    - python >=3.6
  run:
    - pandas
    - python >=3.6

test:
  imports:
    - dynamotable
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://github.com/alisterburt/dynamotable
  summary: dynamotable is a Python package to facilitate reading and writing of table files from the Dynamo subtomogram averaging package
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - alisterburt
    - goanpeca
